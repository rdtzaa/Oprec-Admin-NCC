global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Label global yang ditambahkan ke semua time series
  external_labels:
    monitor: 'ncc-lab-monitoring'
    environment: 'production'

# Lokasi file alerting rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Konfigurasi Alertmanager (untuk mengirim notifikasi)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093   # Alertmanager berjalan di port 9093

# Konfigurasi scraping targets
scrape_configs:
  # Prometheus monitoring dirinya sendiri
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: /metrics
    scheme: http

  # Node Exporter - monitoring sistem
  - job_name: "node"
    static_configs:
      - targets:
          - "localhost:9100"          # Node Exporter di server Prometheus
          - "PRIVATE_IP_GRAFANA:9100" # Node Exporter di server Grafana
                                      # Ganti dengan IP private Grafana EC2 kamu!
    relabel_configs:
      # Tambahkan label server_type berdasarkan instance
      - source_labels: [__address__]
        regex: "localhost.*"
        target_label: server_type
        replacement: prometheus-server
      - source_labels: [__address__]
        regex: ".*:9100"
        target_label: __address__
        action: keep
